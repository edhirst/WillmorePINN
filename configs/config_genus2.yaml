# Willmore energy minimisation — Genus 2 (double torus)
# Conjectured minimum: W = 4π² ≈ 39.48 (Lawson's ξ_{2,1})

topology:
  genus: 2  # 0 = sphere/ellipsoid, 1 = torus, 2 = double torus

  # Two punctured tori (T₁, T₂) with disk boundaries identified.
  # SeamGluingLoss enforces C⁰/C¹/C² continuity via g(r,θ) = (2δ−r,θ).
  double_torus:
    tau1: "0.7j"                # Complex modulus for T₁; Im(τ) controls tube thickness, Re(τ) controls shear
    tau2: "0.7j"                # Complex modulus for T₂; Im(τ) controls tube thickness, Re(τ) controls shear
    disk_radius: 0.65           # Parameter-space radius δ of excluded disk on each torus chart
    torus_major_radius: 1.0     # R: major torus radius; x-separation per torus = R + Im(τ)
    annular_width_factor: 2.0   # Collar outer radius = annular_width_factor · δ (for visualisation and loss sampling)
    disk_center_T1: [0.0, 0.0] # (u₀, v₀) centre of excluded disk on T₁; outer equatorial point of T₁ (u=v=0)
    torus2_offset: [0.0, 0.0, 0.0]  # ℝ³ translation applied to T₂ during pretraining (deprecated; x-flip in model handles gluing alignment)

# Model Architecture
model:
  input_dim: 2                            # Parameter space dimension (u, v)
  output_dim: 3                           # Embedding space dimension (x, y, z)
  hidden_dims: [128, 256, 512, 256, 128]
  activation: "tanh"
  dropout: 0.0
  use_spectral_features: true             # Use Fourier features for periodic input embedding
  num_frequencies: 6                      # Fourier frequency components per dimension → 4·N input features
  initialization: "xavier_uniform"
  use_residual: false                     # Learn corrections to reference embedding rather than full embedding
  residual_scale: 0.5                     # Scale factor for residual corrections

  # Coarse-to-fine Fourier frequency curriculum (Mildenhall et al. 2020):
  # progressively activates higher bands so the network learns global shape before fine detail.
  freq_curriculum:
    warmup_epochs: 0   # Epochs over which to ramp from start_freqs to all frequencies; 0 = disabled
    start_freqs: 1     # Fourier bands active at epoch 1

  # Supervised pretraining: initialise network to match reference embedding before Willmore training.
  supervised_pretraining:
    enabled: true
    num_epochs: 200
    learning_rate: 0.003
    batch_size: 512
    num_points_per_epoch: 4096
    position_weight: 1.0      # Weight for C⁰ position matching
    derivative_weight: 1.0    # Weight for C¹ derivative matching

# Training Parameters
training:
  num_epochs: 2000
  batch_size: 3000
  learning_rate: 0.0002
  weight_decay: 0.000001
  scheduler: "cosine_warm_restarts"
  scheduler_params:
    T_0: 500       # Initial cosine period in epochs
    T_mult: 2      # Each restart multiplies the period by this factor
    eta_min: 0.000001
  gradient_clip: 1.0
  log_frequency: 50  # Log metrics and save checkpoints every N epochs

  # Adaptive safeguards against regularity collapse and topology change.
  adaptive_training:
    enabled: true
    regularity_threshold: 0.1           # Regularity/Willmore ratio above which to boost regularity weight
    regularity_boost_factor: 3.0
    checkpoint_rollback: true
    severe_degradation_threshold: 4.0   # Rollback if regularity increases by this factor
    regularity_abs_threshold: 0.000001  # Minimum absolute regularity before rollback can fire
    willmore_spike_threshold: 0.0       # 0.0 = disabled
    willmore_ema_alpha: 0.3             # EMA decay for Willmore tracking
    max_rollbacks: 30
    willmore_warmup_epochs: 200         # Epochs before topology-collapse rollback can fire
    willmore_warmup_start: 0.01         # Willmore weight fraction at epoch 1
    gluing_annealing: 0.5               # after willmore warmup, gluing weight ramps to this fraction of its initial value

# Sampling Parameters
sampling:
  num_points: 9000
  eval_num_points: 5000      # Uniform eval sample for logged W (reduces MC variance)
  print_eval: false          # If true, full eval runs every epoch; if false, only on log epochs
  noise_level: 0.0
  resample_each_epoch: true

# Loss Function Parameters
loss:
  willmore_weight: 1.0
  max_willmore_weight: 1.0   # Equal to willmore_weight disables annealing
  regularity_weight: 10.0
  target_area: null          # Target surface area (null = adaptive)
  epsilon: 0.000001          # Numerical stability constant
  h2_clip: 50.0              # Huber threshold for H²: exact Willmore below, linear gradient above

  regularity_min_area_element: 0.01       # Floor on √(EG−F²) to prevent Jacobian collapse
  regularity_area_element_weight: 1.0
  regularity_min_positivity: 0.001        # Floor for E = |φ_u|² and G = |φ_v|²; positivity term fires below this
  regularity_metric_positivity_weight: 0.5
  regularity_max_metric_value: 5.0        # Upper threshold for E = |φ_u|² and G = |φ_v|²
  regularity_smoothness_weight: 0.5
  regularity_log_barrier_weight: 2.0      # −log(√(EG−F²)) barrier; gradient diverges as area element → 0
  regularity_mean_area_floor: 0.2         # Fires when mean area element < threshold; prevents global torus degeneration
  regularity_mean_area_floor_weight: 5.0

  # Multi-chart gluing (genus 2 only)
  # SeamGluingLoss samples N points (r, θ) in the collar r ∈ [δ(1−w), δ(1+w)]
  # and enforces C⁰/C¹/C² agreement between both charts via the linear reflection g: (r,θ)↦(2δ−r,θ).
  gluing_weight: 200.0
  gluing_num_points: 256                 # (r, θ) samples in the collar per step
  gluing_collar_width: 0.5               # collar half-width as fraction of δ: r ∈ [δ(1−w), δ(1+w)]
  gluing_c1_weight: 50.0                 # C¹ matching weight relative to C⁰
  gluing_c2_weight: 20.0                 # C² matching weight relative to C⁰

  # Junction circle radius penalty (genus 2 only)
  # ReLU² penalty below junction_min_radius and above junction_max_radius.
  junction_radius_weight: 15.0
  junction_min_radius: 0.6   # ℝ³ radius floor for the gluing circle
  junction_max_radius: 1.1   # ℝ³ radius ceiling for the gluing circle

  # Annular near-disk regularity (genus 2 only)
  # Applies regularity loss in the transition zone δ ≤ r_param ≤ annular_radius_factor·δ.
  # Prevents the embedding from forming a thin funnel just outside the gluing circle.
  annular_regularity_weight: 20.0
  annular_radius_factor: 2.5   # outer/inner ratio of the annular zone in parameter space
  annular_num_points: 256      # samples per chart per step in the annular zone

# Optimiser
optimizer:
  type: "adam"
  betas: [0.9, 0.999]
  momentum: 0.9  # For SGD

# Output and Logging
output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  save_best_only: false
  metric_to_monitor: "willmore_energy"

device: "auto"  # auto, cpu, cuda, mps
seed: 42
dtype: "float32"
