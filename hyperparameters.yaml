# Hyperparameters for Willmore Energy Minimization

# Topology Parameters
# The genus defines the topology of the surface being optimized
topology:
  genus: 2  # 0 = sphere/ellipsoid, 1 = torus, 2 = double torus (genus > 2 not implemented)
  
  # Genus 0 (sphere/ellipsoid) initialization parameters
  # Uses polar coordinates on [0, π] × [0, 2π]
  ellipsoid:
    a: 2.0  # Semi-axis along x
    b: 1.0  # Semi-axis along y  
    c: 0.5  # Semi-axis along z
    # For a sphere, set a = b = c
    # Willmore energy of a sphere is 4π ≈ 12.566 (the minimum for genus 0)
  
  # Genus 1 (torus) initialization parameters
  # Uses doubly-periodic coordinates on [0, 2π] × [0, 2π]
  torus:
    tau: "0.1+0.1j"  # Complex modulus for torus (as string: "1j", "0.5+0.866j", "2j")
               # Clifford torus has tau ≈ 0.707j (1/√2), start slightly higher for visible convergence
               # Can also use dict format: {real: 0.5, imag: 0.866}
    max_height: null  # Optional: maximum height to clip Im(τ) (null = no limit)
    # Clifford torus (R = √2, r = 1) has minimum Willmore energy 2π² ≈ 19.74
  
  # Genus 2 (double torus) — two-chart architecture
  # Two punctured tori (T₁, T₂) with their disk boundaries identified directly.
  # Each torus has a parametric disk D_i excluded from the Willmore integral.
  # A boundary-matching loss enforces C⁰/C¹/C² continuity between φ₁(∂D₁) and φ₂(∂D₂).
  #
  # Parameters:
  #   τ₁, τ₂ ∈ ℂ: modular parameters for each torus
  #     - Im(τ) > 0: controls tube thickness (larger = thinner)
  #     - Re(τ): shear of the fundamental domain
  #   disk_radius: parameter-space radius δ of excluded disks on each torus
  #   disk_center_T1: (u₀, v₀) centre of excluded disk on T₁ (default (0,0) is always optimal)
  #   disk_center_T2: auto-derived from τ₂ — always the closest point of T₂ to T₁
  #   torus2_offset: ℝ³ translation applied to T₂ during pretraining to prevent
  #     initial overlap; the gluing loss pulls φ₁(∂D₁) and φ₂(∂D₂) together during training
  #
  double_torus:
    tau1: "0.85j"   # Im(τ₁) controls tube thickness; Re(τ₁)/Im(τ₁) is the helical twist rate
    tau2: "0.85j"   # Im(τ₂) controls tube thickness; Re(τ₂)/Im(τ₂) is the helical twist rate
    disk_radius: 0.4             # Parameter-space radius of excluded disk on each torus chart
    disk_center_T1: [0.0, 0.0]  # (u₀, v₀) maps to the T₂-facing side of T₁ for any τ₁
    # disk_center_T2 is auto-computed from τ₂ in code: v₀ = (−Re(τ₂)π/Im(τ₂)) mod 2π, u₀ = (π − v₀·Re(τ₂)) mod 2π
    torus2_offset: [4.4, 0.0, 0.0]    # ℝ³ translation applied to T₂ during pretraining; gluing loss pulls φ₁(∂D₁) and φ₂(∂D₂) together during training
    # Lawson's minimal surface ξ_{2,1} has Willmore energy ≈ 4π² ≈ 39.48

# Model Architecture
model:
  # Base network structure
  input_dim: 2  # Dimension of parameter space (u, v coordinates)
  output_dim: 3  # Dimension of embedding space (x, y, z coordinates)
  hidden_dims: [128, 256, 512, 256, 128]  # Hidden layer dimensions
  activation: "tanh"  # Activation function: relu, tanh, elu, silu
  dropout: 0.0  # Dropout rate
  use_spectral_features: true  # Use spectral features: spherical harmonics (genus 0) or Fourier features (genus 1/2)
  num_frequencies: 6  # Spectral order for input embedding. Genus 0: maximum spherical harmonic degree L → (L+1)² features. Genus 1/2: number of Fourier frequency components per dimension → 4·N features.
  initialization: "xavier_uniform"  # Weight initialization: xavier_uniform, xavier_normal, kaiming_uniform, kaiming_normal
  
  # Residual learning (learning corrections to reference embedding)
  use_residual: false  # Learn residuals from reference (true) or full embedding (false)
  residual_scale: 0.5  # Scale factor for residual corrections (only if use_residual=true)

  # Coarse-to-fine Fourier frequency curriculum (NeRF-style, Mildenhall et al. 2020).
  # Progressively activates higher Fourier bands so the network first learns the global
  # shape, then refines high-curvature detail (e.g. bridge junctions).
  # Bands 1..start_freqs are active at epoch 1; remaining bands unlock linearly over
  # warmup_epochs.  Set warmup_epochs: 0 to disable (all bands active throughout).
  freq_curriculum:
    warmup_epochs: 0    # All Fourier bands active from epoch 1 (tuning showed no benefit from ramp)
    start_freqs: 1      # Number of low Fourier bands active at epoch 1 of Willmore training
  
  # Supervised pretraining (initialize network to match reference embedding)
  supervised_pretraining:
    enabled: true  # Whether to pretrain network on reference embedding
    num_epochs: 200  # Thorough pretraining for genus 2 bridge initialisation
    learning_rate: 0.003  # Lower LR for careful pretraining
    batch_size: 512  # Larger batches for stable pretraining
    num_points_per_epoch: 4096  # More points for better coverage
    position_weight: 1.0  # Weight for position continuity loss
    derivative_weight: 1.0  # Match first-order geometry (∂φ/∂u, ∂φ/∂v) during pretraining

# Training Parameters
training:
  num_epochs: 2000
  batch_size: 3000  # Fewer steps/epoch → ~2× fewer gradient computations per epoch
  learning_rate: 0.0002  # Slightly higher to stay effective with warm restarts
  weight_decay: 0.000001  # Lighter weight decay to preserve learned features
  scheduler: "cosine_warm_restarts"  # Warm restarts prevent LR from decaying to near-zero and freezing the model
  scheduler_params:
    T_0: 500        # Cosine period; with T_mult=2: cycles end at 500, 1500, 3500, ... epochs
    T_mult: 2       # Each restart doubles the period
    eta_min: 0.000001  # Low floor for fine-tuning between restarts
  gradient_clip: 1.0
  log_frequency: 50   # Log metrics and save checkpoints every N epochs
  
  # Adaptive safeguards to prevent regularity collapse (applies to all genus types)
  adaptive_training:
    enabled: true  # Enable adaptive weight adjustment based on regularity health
    regularity_threshold: 0.1  # Intervene early, before geometry is already distorted
    regularity_boost_factor: 3.0  # Multiply regularity weight by this when threshold exceeded
    checkpoint_rollback: true   # Rollback to last checkpoint on severe regularity degradation
    severe_degradation_threshold: 4.0  # Rollback if regularity increases by this factor
    regularity_abs_threshold: 0.000001  # Minimum absolute regularity value before rollback can fire (guards against near-zero noise)
    willmore_spike_threshold: 0.0  # Disabled: uncapped W has high MC variance from spiky bridge H²; false rollbacks outweigh benefit
    willmore_ema_alpha: 0.3        # Slightly faster EMA for W tracking
    max_rollbacks: 30  # Maximum number of rollbacks per training run
    willmore_warmup_epochs: 100     # No warmup for continued training; full Willmore weight from epoch 1
    willmore_warmup_start: 1.0    # Willmore weight fraction at epoch 1 of Willmore training
    willmore_topology_floor: 38.0    # Lowered from 4π² to reduce false rollbacks from MC variance; surface topology is confirmed

# Sampling Parameters
# Note: Domain is now automatically determined from topology.genus
# - genus 0: sphere/ellipsoid domain with polar coordinates [0, π] × [0, 2π]
# - genus 1: torus domain with periodic coordinates [0, 2π] × [0, 2π]
# - genus 2: double_torus domain with custom parametrization
sampling:
  num_points: 9000
  eval_num_points: 5000  # Uniform eval sample to reduce MC variance in logged W
  print_eval: false        # If true, full eval runs every epoch. If false, only runs on log/save epochs (faster).
  noise_level: 0.0  # Add Gaussian noise to coordinates
  resample_each_epoch: true  # Whether to resample points each epoch

# Loss Function Parameters
loss:
  willmore_weight: 1.0  # Willmore loss weight (constant throughout training)
  max_willmore_weight: 1.0  # Set equal to willmore_weight to disable annealing
  regularity_weight: 10.0  # Reduced; surface is stable (reg≈−0.22); give more gradient budget to Willmore
  target_area: null  # Target surface area (null for adaptive constraint with bounds)
  epsilon: 0.000001  # Numerical stability constant (1e-6) - smaller for better precision
  h2_clip: 5.0  # Huber threshold for H² in the training integrand. Below √h2_clip: exact Willmore
                # gradient (2H). Above: linear in |H| with constant gradient magnitude 2√h2_clip —
                # never zero, always pushing the junction toward lower curvature.
                # h2_clip=5 caps |H|=2.24; bridge mean |H|≈0.3 so typical points use exact Willmore.
                # Reported willmore_energy is always the true uncapped ∫H²dA.
  regularity_min_area_element: 0.01  # Minimum allowed area element √(EG−F²); only prevents literal Jacobian collapse, not hole shrinkage
  
  # Regularity loss sub-components (normalized internally to sum to 1.0)
  regularity_area_element_weight: 1.0  # Prevent area element collapse
  regularity_metric_positivity_weight: 0.5  # Prevent metric degeneration
  regularity_min_positivity: 0.001  # Floor for E = |φ_u|² and G = |φ_v|²; positivity term fires below this
  regularity_smoothness_weight: 0.5  # Penalise derivatives that exceed the threshold (ReLU gate)
  regularity_log_barrier_weight: 2.0  # Log-barrier −log(√(EG−F²)) on area element; gradient −1/√(EG−F²) fires continuously (no ReLU gate), diverging as area element → 0
  regularity_max_metric_value: 5.0   # Upper threshold for E = |φ_u|² and G = |φ_v|²

  # Mean area element floor: prevents torus sphere-collapse (W→4π per chart).
  # For a torus (R, r) the parameter-space average of √(EG−F²) is R·r.
  # The floor fires when R·r drops below the threshold, providing a global
  # barrier that the per-point min_area_element check cannot give.
  regularity_mean_area_floor: 0.2        # Fires when mean area element < 0.2 (≈ r < 0.2 for R=1)
  regularity_mean_area_floor_weight: 5.0  # Strong barrier against global torus degeneration

  # Multi-chart gluing (genus 2 only)
  gluing_weight: 10.0                    # Strong C°/C¹/C² enforcement to anchor topology during optimisation
  gluing_num_boundary_points: 64          # Number of boundary samples per junction
  gluing_derivative_weight: 0.5          # Weight for C¹ (first derivative) continuity relative to C⁰
  gluing_second_derivative_weight: 0.1   # Reduced from 0.3; C² matching creates extreme gradients at the junction

  # Junction circle radius penalty (genus 2 only)
  # Fires a ReLU² penalty below junction_min_radius; gradient pushes the
  # gluing circle outward, preventing handle degeneration in the excluded disk.
  # Also fires a ReLU² penalty above junction_max_radius; gradient pushes the
  # gluing circle inward, preventing each torus chart from degenerating to a
  # sphere-cap (which would expand the junction circle to sphere-equator scale).
  junction_radius_weight: 3.0   # Same order as other loss terms
  junction_min_radius: 0.3      # ℝ³ radius floor for the gluing circle on each torus chart
  junction_max_radius: 1.2      # ℝ³ radius ceiling for the gluing circle on each torus chart

  # Topology guard (genus 2 only)
  # Exploits the Willmore conjecture (Marques-Neves 2012): any smooth embedded
  # genus-2 surface satisfies W ≥ 4π² ≈ 39.48.  A ReLU² penalty fires when the
  # training Willmore drops below topology_guard_floor, creating an energy floor
  # that makes topology-changing deformations expensive.  At equilibrium the
  # optimizer settles at W ≈ floor, which IS the Lawson minimum.
  topology_guard_weight: 8.0       # Reduced: surface is confirmed genus-2 (gluing < 0.001); allow W to explore below 4π²
  topology_guard_floor: 39.478     # 4π²; fires if W falls below this value

# Optimization
optimizer:
  type: "adam"  # adam, sgd, adamw, rmsprop
  betas: [0.9, 0.999]  # For Adam - higher beta1 for smoother momentum
  momentum: 0.9  # For SGD

# Output and Logging
output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  save_best_only: false  # Save checkpoints at regular intervals (not just best)
  metric_to_monitor: "willmore_energy"  # Metric to monitor for best model
  
# Computation
device: "auto"  # auto, cpu, cuda, mps
               # Note: auto defaults to CPU (MPS has incomplete linalg support)
               # For MPS, set device: "mps" and run with PYTORCH_ENABLE_MPS_FALLBACK=1
seed: 42  # Random seed for reproducibility
dtype: "float32"  # float32 or float64
