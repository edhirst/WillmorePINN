# Hyperparameters for Willmore Energy Minimization

# Model Architecture
model:
  # Base network structure
  input_dim: 2  # Dimension of parameter space (u, v coordinates)
  output_dim: 3  # Dimension of embedding space (x, y, z coordinates)
  hidden_dims: [128, 256, 512, 256, 128]  # Hidden layer dimensions
  activation: "tanh"  # Activation function: relu, tanh, elu, silu
  dropout: 0.0  # Dropout rate
  use_batch_norm: true  # Use batch normalization
  use_periodic_embedding: true  # Use Fourier features to enforce periodicity
  num_frequencies: 2  # Fewer frequencies = smoother surfaces (reduces high-freq artifacts)
  initialization: "xavier_uniform"  # Weight initialization: xavier_uniform, xavier_normal, kaiming_uniform, kaiming_normal
  
  # Residual learning (learning corrections to reference embedding)
  use_residual: false  # Learn residuals from reference (true) or full embedding (false)
  residual_scale: 0.5  # Scale factor for residual corrections (only if use_residual=true)
  
  # Supervised pretraining (initialize network to match reference embedding)
  supervised_pretraining:
    enabled: true  # Whether to pretrain network on reference embedding
    num_epochs: 500  # Many epochs for very smooth supervised learning
    learning_rate: 0.005  # Lower LR for more careful pretraining
    batch_size: 512  # Larger batches for stable pretraining
    num_points_per_epoch: 8192  # Many points for excellent coverage
    position_weight: 1.0  # Weight for position matching loss
    derivative_weight: 0.5  # Higher derivative weight for better geometry learning

# Training Parameters
training:
  num_epochs: 300  # Long training run to converge to Clifford torus
  batch_size: 512  # Larger batches for more stable gradients
  learning_rate: 0.0001  # Much lower LR for smooth, stable optimization
  weight_decay: 0.00001  # Lighter weight decay to preserve learned features
  scheduler: "cosine"  # Learning rate scheduler: step, cosine, exponential, plateau, none
  scheduler_params:
    T_max: 100  # Match num_epochs for full cosine cycle
    eta_min: 0.00001  # Low final LR for fine-tuning
  gradient_clip: 0.5  # Tighter gradient clipping to prevent large jumps
  save_frequency: 25  # Save checkpoint every n epochs
  log_frequency: 25  # Log metrics more frequently to monitor stability

# Sampling Parameters
sampling:
  num_points: 20000  # More points for accurate geometry
  domain: "torus"  # Domain type: sphere, torus, ellipsoid, custom
  domain_params:
    radius: 1.0  # For sphere
    tau: "0.5j"  # Complex modulus for torus (as string: "1j", "0.5+0.866j", "2j")
               # Default "1j" gives standard square torus
               # Can also use dict format: {real: 0.5, imag: 0.866}
    max_height: null  # Optional: maximum height to clip Im(τ) (null = no limit)
    center: [0.0, 0.0, 0.0]
  noise_level: 0.0  # Add Gaussian noise to coordinates
  resample_each_epoch: true  # Whether to resample points each epoch
  use_rotation_augmentation: true  # Apply random z-axis rotations for symmetry enforcement

# Loss Function Parameters
loss:
  willmore_weight: 0.05  # Start very low, increase gradually (prevents roughness)
  regularity_weight: 10.0  # Metric regularity preservation (decreases to 5.0)
  target_area: null  # Target surface area (null for adaptive constraint with bounds)
  target_volume: null  # Target enclosed volume (null for adaptive constraint with bounds)
  epsilon: 0.000001  # Numerical stability constant (1e-6) - smaller for better precision
  
  # Regularity loss sub-components (normalized internally to sum to 1.0)
  regularity_area_element_weight: 1.0  # Prevent area element collapse
  regularity_orientation_weight: 1.0  # Maintain consistent orientation
  regularity_metric_positivity_weight: 1.0  # Prevent metric degeneration
  regularity_smoothness_weight: 1.0  # Penalize large derivatives
  # Note: Regularity constraints weighted heavily initially to maintain well-conditioned metric, then can anneal Willmore up

  # Disabled losses (moved to end of losses.py):
  # - area_weight: 0.0
  # - volume_weight: 0.0
  # - symmetry_weight: 0.0

# Optimization
optimizer:
  type: "adam"  # adam, sgd, adamw, rmsprop
  betas: [0.9, 0.999]  # For Adam - higher beta1 for smoother momentum
  momentum: 0.9  # For SGD

# Output and Logging
output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  save_best_only: false  # Save checkpoints at regular intervals (not just best)
  metric_to_monitor: "willmore_energy"  # Metric to monitor for best model
  
# Computation
device: "auto"  # auto, cpu, cuda, mps
               # Note: auto defaults to CPU (MPS has incomplete linalg support)
               # For MPS, set device: "mps" and run with PYTORCH_ENABLE_MPS_FALLBACK=1
seed: 42  # Random seed for reproducibility
dtype: "float32"  # float32 or float64
