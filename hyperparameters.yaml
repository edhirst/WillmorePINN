# Hyperparameters for Willmore Energy Minimization

# Topology Parameters
# The genus defines the topology of the surface being optimized
topology:
  genus: 2  # 0 = sphere/ellipsoid, 1 = torus, 2 = double torus (genus > 2 not implemented)
  
  # Genus 0 (sphere/ellipsoid) initialization parameters
  # Uses polar coordinates on [0, π] × [0, 2π]
  ellipsoid:
    a: 2.0  # Semi-axis along x
    b: 1.0  # Semi-axis along y  
    c: 0.5  # Semi-axis along z
    # For a sphere, set a = b = c
    # Willmore energy of a sphere is 4π ≈ 12.566 (the minimum for genus 0)
  
  # Genus 1 (torus) initialization parameters
  # Uses doubly-periodic coordinates on [0, 2π] × [0, 2π]
  torus:
    tau: "0.1+0.1j"  # Complex modulus for torus (as string: "1j", "0.5+0.866j", "2j")
               # Clifford torus has tau ≈ 0.707j (1/√2), start slightly higher for visible convergence
               # Can also use dict format: {real: 0.5, imag: 0.866}
    max_height: null  # Optional: maximum height to clip Im(τ) (null = no limit)
    # Clifford torus (R = √2, r = 1) has minimum Willmore energy 2π² ≈ 19.74
  
  # Genus 2 (double torus) initialization parameters
  # Two independent tori connected by a catenoid (capillary bridge)
  #
  # GEOMETRY:
  # - Two tori with major radius axes parallel to z-axis (standard orientation)
  # - Centers at y=0, z=0, separated along x-axis
  # - Catenoid bridge parallel to x-axis, centered at y=0, z=0
  #
  # SEPARATION:
  # min x-span = R1 + r1 + R2 + r2 + L1 + L2  where L = a·arccosh(r/a) is the catenoid half-length
  # neck_length adds an extra gap on top of this; 0 = most compact valid geometry
  #
  # THREE FUNDAMENTAL DOMAINS:
  # 1. Torus 1 parallelogram (with gluing disk excluded)
  # 2. Catenoid rectangle
  # 3. Torus 2 parallelogram (with gluing disk excluded)
  #
  # Parameters:
  #   τ₁, τ₂ ∈ ℂ: modular parameters for each torus
  #     - Im(τ) > 0: controls tube thickness (larger = thinner)
  #     - Re(τ): shear of the fundamental domain
  #   neck_length: physical length of the catenoid bridge
  #   neck_twist: twist at the bridge (placeholder, not yet implemented)
  #
  double_torus:
    # Torus 1 modular parameter (same string format as genus 1 tau)
    tau1: "0.7j"   # Im(τ₁) controls tube thickness; Re(τ₁)/Im(τ₁) is the helical twist rate
    
    # Torus 2 modular parameter
    tau2: "0.7j"   # Im(τ₂) controls tube thickness; Re(τ₂)/Im(τ₂) is the helical twist rate
    
    # Catenoid bridge parameters
    # bridge_radius: minimum radius at the catenoid neck
    # The catenoid length is computed automatically to match tube radii
    # r(s) = a * cosh(s/a), where a = bridge_radius
    bridge_radius: 0.33  # Waist radius of catenoid neck; 0.33 ≈ 0.84·r for τ=0.7j, giving a wide initial neck
    neck_twist: 0.0      # Rigid angular offset of T2's tube at the bridge attachment
    neck_length: 0.1     # Extra gap relative to natural catenoid length; 0 = compact (catenoid just fits), positive = tori further apart; small positive value starts away from the catenoid existence boundary
    s_blend: 0.4         # Half-width (radians) of quintic blend zone at each junction (T1↔bridge, bridge↔T2)
    # Lawson's minimal surface ξ_{2,1} has Willmore energy ≈ 2π² × 2 = 4π² ≈ 39.48

# Model Architecture
model:
  # Base network structure
  input_dim: 2  # Dimension of parameter space (u, v coordinates)
  output_dim: 3  # Dimension of embedding space (x, y, z coordinates)
  hidden_dims: [128, 256, 512, 256, 128]  # Hidden layer dimensions
  activation: "tanh"  # Activation function: relu, tanh, elu, silu
  dropout: 0.0  # Dropout rate
  use_spectral_features: true  # Use spectral features: spherical harmonics (genus 0) or Fourier features (genus 1/2)
  num_frequencies: 6  # Spectral order for input embedding. Genus 0: maximum spherical harmonic degree L → (L+1)² features. Genus 1/2: number of Fourier frequency components per dimension → 4·N features.
  initialization: "xavier_uniform"  # Weight initialization: xavier_uniform, xavier_normal, kaiming_uniform, kaiming_normal
  
  # Residual learning (learning corrections to reference embedding)
  use_residual: false  # Learn residuals from reference (true) or full embedding (false)
  residual_scale: 0.5  # Scale factor for residual corrections (only if use_residual=true)

  # Coarse-to-fine Fourier frequency curriculum (NeRF-style, Mildenhall et al. 2020).
  # Progressively activates higher Fourier bands so the network first learns the global
  # shape, then refines high-curvature detail (e.g. bridge junctions).
  # Bands 1..start_freqs are active at epoch 1; remaining bands unlock linearly over
  # warmup_epochs.  Set warmup_epochs: 0 to disable (all bands active throughout).
  freq_curriculum:
    warmup_epochs: 0    # All Fourier bands active from epoch 1 (tuning showed no benefit from ramp)
    start_freqs: 1      # Number of low Fourier bands active at epoch 1 of Willmore training
  
  # Supervised pretraining (initialize network to match reference embedding)
  supervised_pretraining:
    enabled: true  # Whether to pretrain network on reference embedding
    num_epochs: 150
    learning_rate: 0.003  # Lower LR for careful pretraining
    batch_size: 512  # Larger batches for stable pretraining
    num_points_per_epoch: 4096  # More points for better coverage
    position_weight: 1.0  # Weight for position matching loss
    derivative_weight: 1.0  # Match first-order geometry (∂φ/∂u, ∂φ/∂v) during pretraining

# Training Parameters
training:
  num_epochs: 1000
  batch_size: 2000  # Larger batches for more stable gradients
  learning_rate: 0.0002
  weight_decay: 0.000001  # Lighter weight decay to preserve learned features
  scheduler: "cosine"  # Single cosine decay — restarts are disruptive on a slowly annealing loss landscape
  scheduler_params:
    T_max: 1000  # Full cosine half-cycle over the entire training run (T_max = num_epochs avoids LR restart)
    eta_min: 0.0000005  # Low floor enables fine-tuning in final epochs
  gradient_clip: 1.0
  log_frequency: 10   # Log metrics and save checkpoints every N epochs
  
  # Adaptive safeguards to prevent regularity collapse (applies to all genus types)
  adaptive_training:
    enabled: true  # Enable adaptive weight adjustment based on regularity health
    regularity_threshold: 0.3  # Lower threshold for earlier intervention
    regularity_boost_factor: 2.0  # Multiply regularity weight by this when threshold exceeded
    checkpoint_rollback: false  # Rollbacks trigger on MC variance of regularity, not genuine degradation
    severe_degradation_threshold: 4.0  # Rollback if regularity increases by this factor
    regularity_abs_threshold: 0.000001  # Minimum absolute regularity value before rollback can fire (guards against near-zero noise)
    willmore_spike_threshold: 0.0  # Disabled: uncapped W has high MC variance from spiky bridge H²; false rollbacks outweigh benefit
    willmore_ema_alpha: 0.3        # Slightly faster EMA for W tracking
    max_rollbacks: 30  # Maximum number of rollbacks per training run
    early_stopping_patience: 100
    willmore_warmup_epochs: 100  # Ramp willmore_weight from willmore_warmup_start × initial value to the full value over this many epochs
    willmore_warmup_start: 0.02  # Willmore weight as a fraction of its configured value at epoch 1 of warmup

# Sampling Parameters
# Note: Domain is now automatically determined from topology.genus
# - genus 0: sphere/ellipsoid domain with polar coordinates [0, π] × [0, 2π]
# - genus 1: torus domain with periodic coordinates [0, 2π] × [0, 2π]
# - genus 2: double_torus domain with custom parametrization
sampling:
  num_points: 20000
  eval_num_points: 20000  # Larger uniform eval sample to reduce MC variance in logged W (bridge H² is spiky)
  print_eval: false        # If true, full eval runs every epoch. If false, only runs on log/save epochs (faster).
  noise_level: 0.0  # Add Gaussian noise to coordinates
  resample_each_epoch: true  # Whether to resample points each epoch
  bridge_oversample_factor: 4.0  # Bridge receives ~4× more samples than its area fraction; targets the dominant W contributor
  use_rotation_augmentation: false  # Apply random z-axis rotations for symmetry enforcement
  # Junction-focus curriculum (genus 2 only):
  # Phase 1 samples junction_focus_start fraction of points from Gaussians around v=2π
  # and v=3π (the T1/bridge and bridge/T2 junctions).  The fraction cosine-anneals
  # to zero over junction_focus_epochs, after which sampling is fully uniform.
  junction_focus_start: 0.6   # Start with heavy junction focus to fix the high-curvature blend zones quickly
  junction_focus_floor: 0.0   # Anneal to fully uniform; once junctions are learned, shift focus to bridge interior
  junction_focus_epochs: 80   # Junctions converge in ~50–80 epochs; anneal over that window
  junction_sigma: 1.0         # Gaussian std dev (radians) around each junction centre; ±3σ = ±3 rad covers full blend zone and bridge interior

# Loss Function Parameters
loss:
  willmore_weight: 1.0  # Willmore loss weight (constant throughout training)
  max_willmore_weight: 1.0  # Set equal to willmore_weight to disable annealing
  regularity_weight: 2.0  # Maintains well-conditioned metric throughout; best mean score in tuning
  target_area: null  # Target surface area (null for adaptive constraint with bounds)
  epsilon: 0.000001  # Numerical stability constant (1e-6) - smaller for better precision
  h2_clip: 50  # Huber threshold for H² in the training integrand. Below √h2_clip: exact Willmore
               # gradient (2H). Above: linear in |H| with constant gradient magnitude 2√h2_clip —
               # never zero, always pushing the junction toward lower curvature.
               # Reported willmore_energy is always the true uncapped ∫H²dA.
  regularity_min_area_element: 0.05  # Minimum allowed area element √(EG−F²); 5× higher than default to prevent bridge neck collapse
  
  # Regularity loss sub-components (normalized internally to sum to 1.0)
  regularity_area_element_weight: 1.0  # Prevent area element collapse
  regularity_orientation_weight: 1.0  # Maintain consistent orientation
  regularity_metric_positivity_weight: 0.5  # Prevent metric degeneration (enable for stability)
  regularity_smoothness_weight: 0.5  # Penalise derivatives that exceed the threshold (ReLU gate)
  regularity_conformal_weight: 2.0   # Weight for Dirichlet excess (E+G)/(2√(EG−F²)) − 1 within the regularity loss; non-zero even for smooth surfaces
  regularity_max_metric_value: 10.0  # Upper threshold for E = |φ_u|² and G = |φ_v|²; excess beyond this is penalised
  # Note: Regularity constraints weighted heavily initially to maintain well-conditioned metric, then can anneal Willmore up

  # Topology guard (genus 2 only): evaluates regularity at fixed probe locations
  # in each torus body AND the bridge midpoint on every forward pass, guaranteeing
  # gradient signal that protects handles and the bridge from collapsing regardless
  # of the main sampling distribution.
  # Probe v values: π (T1 mid), 2.5π (bridge mid), 4π (T2 mid).
  topology_guard_weight: 1.0    # Higher than regularity_weight: specifically probes bridge midpoint (v=2.5π) to prevent neck collapse
  topology_guard_num_probes: 64 # Random-u probe points per location per forward pass

  # Self-avoidance: penalise pairs of parameter-space points that are far apart
  # (topologically non-adjacent) but close in 3-D.  The only loss that can directly
  # detect and discourage self-intersection.  See _self_avoidance_penalty in losses.py.
  self_avoidance_weight: 0.2           # Strongest topology protection; best mean score in tuning
  self_avoidance_d_avoid: 0.2          # Target minimum 3-D separation for distant pairs
  self_avoidance_d_param_min: 2.5      # Parameter-space L2 threshold for pairing (T1–T2 min ≈ π)
  self_avoidance_num_pairs: 1000       # Random pairs per forward call

# Optimization
optimizer:
  type: "adam"  # adam, sgd, adamw, rmsprop
  betas: [0.9, 0.999]  # For Adam - higher beta1 for smoother momentum
  momentum: 0.9  # For SGD

# Output and Logging
output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  save_best_only: false  # Save checkpoints at regular intervals (not just best)
  metric_to_monitor: "willmore_energy"  # Metric to monitor for best model
  
# Computation
device: "auto"  # auto, cpu, cuda, mps
               # Note: auto defaults to CPU (MPS has incomplete linalg support)
               # For MPS, set device: "mps" and run with PYTORCH_ENABLE_MPS_FALLBACK=1
seed: 42  # Random seed for reproducibility
dtype: "float32"  # float32 or float64
